name: Native audio core

on:
  push:
    paths:
      - "native/**"
      - "scripts/**"
      - ".github/workflows/native.yml"
  pull_request:
  workflow_dispatch:

jobs:
  # Fast feedback on Linux: the portable DSP + engine tests need no Windows SDK.
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run portable tests
        run: ./scripts/run-native-tests.sh

  # Compiles the real WASAPI backend with MSVC and produces the addon.
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build native addon (node-gyp + MSVC)
        shell: bash
        run: |
          mkdir -p ci-out
          set +e
          ( cd native && npx --yes node-gyp rebuild --verbose 2>&1 ) | tee ci-out/addon-build-raw.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            grep -iE "error|warning C[0-9]+|gyp ERR" ci-out/addon-build-raw.log | head -200 > ci-out/addon-build.log
            echo "node-gyp failed with exit code $status" >> ci-out/addon-build.log
            rm -f ci-out/addon-build-raw.log
            exit 1
          fi
          rm -f ci-out/addon-build-raw.log
          test -f native/build/Release/streamaudiofilter.node
          echo "addon built: $(ls -l native/build/Release/streamaudiofilter.node)"

      - name: Portable tests compiled by cl.exe
        shell: cmd
        run: |
          mkdir ci-out
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cd native
          cl /nologo /std:c++17 /EHsc /utf-8 /W4 /wd4100 /D_USE_MATH_DEFINES /DNOMINMAX /Fe:build\msvc\dsp_tests.exe /Fo:build\msvc\ test\dsp_tests.cc src\dsp\ring_buffer.cc src\dsp\convert.cc src\dsp\resampler.cc src\dsp\mixer.cc >> ..\ci-out\msvc-tests.log 2>&1
          cl /nologo /std:c++17 /EHsc /utf-8 /W4 /wd4100 /D_USE_MATH_DEFINES /DNOMINMAX /Fe:build\msvc\engine_tests.exe /Fo:build\msvc\ test\engine_tests.cc src\app_identity.cc src\engine.cc src\mock\mock_backend.cc src\dsp\ring_buffer.cc src\dsp\convert.cc src\dsp\resampler.cc src\dsp\mixer.cc >> ..\ci-out\msvc-tests.log 2>&1
          build\msvc\dsp_tests.exe >> ..\ci-out\msvc-tests.log 2>&1
          build\msvc\engine_tests.exe >> ..\ci-out\msvc-tests.log 2>&1
          type ..\ci-out\msvc-tests.log
          findstr /C:": error" /C:"error C" /C:"FAIL" ..\ci-out\msvc-tests.log > nul && exit /b 1
          exit /b 0

      - name: Upload addon
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streamaudiofilter-node-windows-x64
          path: native/build/Release/streamaudiofilter.node
          if-no-files-found: warn

      # The agent that maintains this repository can not reach the log host of
      # GitHub Actions, so the useful part of the build output is committed.
      # Uploaded artifacts and the normal UI logs remain the source of truth for
      # humans.
      - name: Publish build log
        if: always()
        shell: bash
        run: |
          mkdir -p ci-out
          git config user.email "ci@streamaudiofilter.invalid"
          git config user.name "StreamAudioFilter CI"
          git add -f ci-out
          git commit -m "ci: native build output" || echo "nothing to publish"
          git push || echo "log push failed"
