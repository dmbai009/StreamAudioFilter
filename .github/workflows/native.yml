name: Build and test

on:
  # Reused by .github/workflows/release.yml, which only publishes what this
  # workflow has built and tested.
  workflow_call:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

# Every job is a gate: a compiler error, a failing check, a type error, a lint
# error or a missing artifact fails the run. Logs that help diagnosing a
# failure are uploaded as artifacts; nothing is committed back to the branch.
jobs:
  # The portable parts on Linux: DSP + engine tests (g++), and the audio host
  # with its signal generator, tested through its real line protocol.
  portable:
    name: Engine and host (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Versions agree (plugin, host, installer)
        run: |
          plugin=$(sed -n 's/.*PLUGIN_VERSION = "\([^"]*\)".*/\1/p' version.ts)
          protocol=$(sed -n 's/.*PROTOCOL_VERSION = \([0-9]*\).*/\1/p' version.ts)
          native=$(sed -n 's/.*SAF_VERSION "\([^"]*\)".*/\1/p' native/src/version.h)
          nprotocol=$(sed -n 's/.*SAF_PROTOCOL \([0-9]*\).*/\1/p' native/src/version.h)
          manifest=$(sed -n 's/.*name="StreamAudioFilter.Setup" version="\([0-9.]*\)\.0".*/\1/p' native/src/setup/setup.manifest)
          echo "plugin $plugin/$protocol, native $native/$nprotocol, setup manifest $manifest"
          test -n "$plugin" && test "$plugin" = "$native" && test "$protocol" = "$nprotocol" && test "$plugin" = "$manifest" \
            || { echo "::error::version.ts, native/src/version.h and setup.manifest must carry the same version"; exit 1; }

      - name: DSP and engine tests (g++)
        run: ./scripts/run-native-tests.sh

      - name: Build the audio host (signal generator only)
        run: ./scripts/build-host.sh

      - name: Host protocol tests
        run: node tests/host.test.mjs native/build/host/saf-audio-host

  # The plugin's TypeScript: pure tests, then type check + lint inside the
  # Vencord release the bundle is built from, exactly as Vencord's CI does.
  typescript:
    name: Plugin (TypeScript, inside Vencord)
    runs-on: ubuntu-latest
    env:
      CI: "true"
      VENCORD_REF: v1.15.11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rule tests
        run: npx --yes tsx tests/rules.test.ts

      - name: Share audio decision tests (fail closed, Discord patch regexes)
        run: npx --yes tsx tests/soundshare.test.ts

      - name: Vencord ${{ env.VENCORD_REF }}
        run: |
          git clone --depth 1 --branch "$VENCORD_REF" https://github.com/Vencord/Vencord "$RUNNER_TEMP/vencord"
          cd "$RUNNER_TEMP/vencord"
          pnpm_version="$(node -e 'console.log(require("./package.json").packageManager.replace(/^pnpm@/, ""))')"
          npm install --global "pnpm@$pnpm_version"
          pnpm install --frozen-lockfile

      - name: tsc + eslint
        run: VENCORD_DIR="$RUNNER_TEMP/vencord" bash dev/typecheck.sh

  # Windows: the real WASAPI build, the same portable tests compiled by MSVC,
  # the host and the installer tested on Windows, and the diagnostic probe.
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @("scripts/install.ps1", "scripts/build-host.ps1")) {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path, [ref]$null, [ref]$errors) | Out-Null
              foreach ($e in $errors) { $failed = $true; Write-Host "::error file=$file::$($e.Message)" }
          }
          if ($failed) { exit 1 }

      - name: Build the audio host
        shell: pwsh
        run: ./scripts/build-host.ps1

      - name: Portable tests compiled and run by cl.exe
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" >nul
          cd native
          if not exist build\msvc mkdir build\msvc
          set FLAGS=/nologo /std:c++17 /EHsc /utf-8 /W4 /wd4100 /D_USE_MATH_DEFINES /DNOMINMAX
          set DSP=src\dsp\ring_buffer.cc src\dsp\convert.cc src\dsp\resampler.cc src\dsp\mixer.cc
          cl %FLAGS% /Fe:build\msvc\dsp_tests.exe /Fo:build\msvc\ test\dsp_tests.cc %DSP% || exit /b 1
          cl %FLAGS% /Fe:build\msvc\engine_tests.exe /Fo:build\msvc\ test\engine_tests.cc src\app_identity.cc src\capture_group.cc src\engine.cc src\hr_advice.cc src\mock\mock_backend.cc %DSP% || exit /b 1
          build\msvc\dsp_tests.exe || exit /b 1
          build\msvc\engine_tests.exe || exit /b 1

      - name: Host protocol tests (Windows build)
        run: node tests/host.test.mjs native/build/host/saf-audio-host.exe

      - name: Build the installer with a test payload
        shell: pwsh
        run: |
          $payload = Join-Path $env:RUNNER_TEMP "payload"
          New-Item -ItemType Directory -Force (Join-Path $payload "dist") | Out-Null
          $version = (Select-String -Path version.ts -Pattern 'PLUGIN_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          Set-Content (Join-Path $payload "dist\patcher.js") "// test"
          Set-Content (Join-Path $payload "dist\preload.js") "// test"
          Set-Content (Join-Path $payload "dist\renderer.js") "const v=`"$version`";forceHookSoundshare();"
          Copy-Item native\build\host\saf-audio-host.exe $payload
          Set-Content (Join-Path $payload "saf-version.txt") "version=$version`nprotocol=1`nvencord=test"
          ./scripts/build-host.ps1 -Setup -PayloadDir $payload

      - name: Installer tests (fake user profile)
        run: node tests/setup.test.mjs native/build/setup/saf-setup.exe native/build/host/saf-audio-host.exe

      - name: Build the standalone process loopback probe
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" >nul
          cd native
          if not exist build\probe mkdir build\probe
          cl /nologo /std:c++17 /EHsc /W4 /D_USE_MATH_DEFINES /DNOMINMAX /DWIN32_LEAN_AND_MEAN /Fo:build\probe\ /Fe:build\probe\process-loopback-probe.exe tools\process_loopback_probe\main.cc src\hr_advice.cc /link ole32.lib oleaut32.lib uuid.lib mmdevapi.lib || exit /b 1
          build\probe\process-loopback-probe.exe --list >nul || exit /b 1

      - name: Upload the audio host
        uses: actions/upload-artifact@v4
        with:
          name: saf-audio-host-windows-x64
          path: native/build/host/saf-audio-host.exe
          if-no-files-found: error

      - name: Upload the probe
        uses: actions/upload-artifact@v4
        with:
          name: process-loopback-probe-windows-x64
          path: native/build/probe/process-loopback-probe.exe
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: native/build/**/*.log
          if-no-files-found: ignore
