name: Release

# Publishing is driven by a tag, never by a developer machine: the files that
# reach users are the ones these runs built, after the same gates as a normal
# commit. If any gate fails, no release is created.
#
# Assets (all from one commit, one version):
#   StreamAudioFilter-Setup.exe          recommended: install / repair / uninstall
#   streamaudiofilter-vencord-dist.zip   manual installation: Vencord + plugin
#   saf-audio-host.exe                   manual installation: the audio host
#   process-loopback-probe.exe           diagnosis without Discord
#   SHA256SUMS.txt
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (must already exist, e.g. v0.2.0)"
        required: true

jobs:
  gate:
    name: Build and test
    uses: ./.github/workflows/native.yml

  bundle:
    name: Prebuilt Vencord bundle
    uses: ./.github/workflows/bundle.yml

  installer:
    name: StreamAudioFilter-Setup.exe
    needs: [gate, bundle]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: saf-audio-host-windows-x64
          path: ${{ runner.temp }}/host
      - uses: actions/download-artifact@v4
        with:
          name: streamaudiofilter-vencord-bundle
          path: ${{ runner.temp }}/bundle

      - name: Assemble the payload and build the installer
        shell: pwsh
        run: |
          $payload = Join-Path $env:RUNNER_TEMP "payload"
          $unpacked = Join-Path $env:RUNNER_TEMP "unpacked"
          Expand-Archive (Join-Path $env:RUNNER_TEMP "bundle\streamaudiofilter-vencord-dist.zip") $unpacked
          New-Item -ItemType Directory -Force (Join-Path $payload "dist") | Out-Null
          Copy-Item (Join-Path $unpacked "Vencord-dist\*") (Join-Path $payload "dist")
          New-Item -ItemType Directory -Force (Join-Path $payload "clean-dist") | Out-Null
          Copy-Item (Join-Path $unpacked "Vencord-clean\*") (Join-Path $payload "clean-dist")
          Copy-Item (Join-Path $env:RUNNER_TEMP "host\saf-audio-host.exe") $payload
          $version = (Select-String -Path version.ts -Pattern 'PLUGIN_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $protocol = (Select-String -Path version.ts -Pattern 'PROTOCOL_VERSION = (\d+)').Matches[0].Groups[1].Value
          $vencord = (Select-String -Path (Join-Path $unpacked "VENCORD-VERSION.txt") -Pattern 'Vencord ref:\s+(\S+)').Matches[0].Groups[1].Value
          Set-Content (Join-Path $payload "saf-version.txt") "version=$version`nprotocol=$protocol`nvencord=$vencord"
          # pack-payload.mjs refuses parts whose versions differ.
          ./scripts/build-host.ps1 -Setup -PayloadDir $payload
          Copy-Item native\build\setup\saf-setup.exe (Join-Path $env:RUNNER_TEMP "StreamAudioFilter-Setup.exe")
          # The installer that is published answers its own version.
          $answer = & (Join-Path $env:RUNNER_TEMP "StreamAudioFilter-Setup.exe") --version | Out-String
          if ($answer.Trim() -ne $version) { throw "the installer reports '$($answer.Trim())', expected $version" }

      - uses: actions/upload-artifact@v4
        with:
          name: streamaudiofilter-setup
          path: ${{ runner.temp }}/StreamAudioFilter-Setup.exe
          if-no-files-found: error

  publish:
    name: Publish
    needs: [gate, bundle, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify and checksum
        run: |
          set -euo pipefail
          cd dist
          for f in StreamAudioFilter-Setup.exe streamaudiofilter-vencord-dist.zip saf-audio-host.exe process-loopback-probe.exe; do
              test -s "$f" || { echo "::error::$f is missing"; exit 1; }
          done
          for f in StreamAudioFilter-Setup.exe saf-audio-host.exe process-loopback-probe.exe; do
              head -c 2 "$f" | grep -q MZ || { echo "::error::$f is not a Windows executable"; exit 1; }
          done
          sha256sum StreamAudioFilter-Setup.exe streamaudiofilter-vencord-dist.zip saf-audio-host.exe process-loopback-probe.exe | tee SHA256SUMS.txt

      - name: Release notes
        run: |
          cat > /tmp/NOTES.md <<EOF
          ## Installation

          **Recommended:** download **StreamAudioFilter-Setup.exe**, quit Discord (tray icon → Quit), run it, choose your Discord, press **Install**, start Discord. The plugin is enabled by default; its panel opens from the button next to the microphone. Run the installer again to repair (for example after a Discord update removed Vencord) or to uninstall.

          ## Changes

          - A single **Mute all stream audio** button silences the plugin mix in both application modes and restores the previous mix.
          - Installer shows installed/available versions and offers Install, Update, Reinstall and Uninstall.
          - Removal preserves Vencord and lets you keep or reset this plugin's settings. Legacy database keys are cleared on the plugin's next start.
          - Fixed a race when replacing the audio host and a Windows test issue.

          The installer needs no administrator rights and downloads nothing. Existing Vencord and other plugins' settings are preserved. Restart Discord after installation or removal.

          **Manual:** \`streamaudiofilter-vencord-dist.zip\` (Vencord with the plugin, see its README) plus \`saf-audio-host.exe\` into \`%APPDATA%\\Vencord\\streamAudioFilter\\native\\\`. All files must come from the same release.

          ## Checksums (SHA-256)

          \`\`\`
          $(cat dist/SHA256SUMS.txt)
          \`\`\`

          Built from commit \`${GITHUB_SHA:0:7}\` after every test gate passed.
          EOF

      - name: Publish
        run: |
          set -euo pipefail
          test -n "$TAG"
          cd dist
          assets="StreamAudioFilter-Setup.exe streamaudiofilter-vencord-dist.zip saf-audio-host.exe process-loopback-probe.exe SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" $assets --clobber
              gh release edit "$TAG" --notes-file /tmp/NOTES.md
          else
              gh release create "$TAG" $assets --title "StreamAudioFilter $TAG" --notes-file /tmp/NOTES.md --verify-tag
          fi
          gh release view "$TAG"
