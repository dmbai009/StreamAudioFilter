name: Prebuilt Vencord bundle

# Builds "Vencord + StreamAudioFilter" as a ready to use distribution, so that a
# user can install the plugin without Node.js, without a compiler and without
# running a build: unpack the bundle into %APPDATA%\Vencord\dist, drop the
# audio host next to it, restart Discord. Release builds embed it into
# StreamAudioFilter-Setup.exe.
#
# The same job runs for pull requests, so the bundle cannot rot unnoticed: if a
# change stops the plugin from ending up in the bundle, this job fails.
#
# Every step runs through .github/ci/step.sh so that a failure publishes the
# tail of its log as an annotation (job logs are not reachable everywhere).
#
# The Vencord checkout lives in $RUNNER_TEMP, outside the repository checkout:
# copying this repository into a directory *inside* itself makes rsync report
# "vanished source files" (exit 24) and risks copying the copy.

on:
  workflow_call:
  push:
    branches:
      - "**"
    paths:
      - "apps/**"
      - "components/**"
      - "stream/**"
      - "ui/**"
      - "*.ts"
      - "*.tsx"
      - "style.css"
      - ".github/ci/**"
      - ".github/workflows/bundle.yml"
  pull_request:
  workflow_dispatch:

env:
  # pnpm refuses to replace an existing node_modules directory without a TTY
  # unless it knows it is in CI, and a runner has no TTY to answer that.
  CI: "true"

  # The Vencord release the bundle is built from. The bundle switches Vencord's
  # own updater off on purpose (see the build step), so this pin is what users
  # get until a new release of this repository is published: bump it
  # deliberately, then tag a release.
  VENCORD_REF: v1.15.11

jobs:
  bundle:
    name: Vencord + plugin (no build on the user's machine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Cheap, and it answers "is there room / what tools are these" before any
      # of it can matter.
      - name: Environment
        run: |
          bash .github/ci/step.sh "Environment" <<'SCRIPT'
          set -euo pipefail
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE" | sed 's/  */ /g'
          echo "cpus: $(nproc), memory: $(free -m | awk '/Mem:/ {print $2" MiB"}')"
          tar --version | head -1
          bash --version | head -1
          SCRIPT

      - name: Fetch Vencord ${{ env.VENCORD_REF }} and the pnpm it pins
        run: |
          bash .github/ci/step.sh "Fetch Vencord" <<'SCRIPT'
          set -euo pipefail
          vencord_dir="$RUNNER_TEMP/vencord"
          rm -rf "$vencord_dir"
          git clone --depth 1 --branch "$VENCORD_REF" https://github.com/Vencord/Vencord "$vencord_dir"
          test -f "$vencord_dir/package.json"

          # The pnpm version is the one Vencord pins for itself: its own release
          # job installs pnpm from this very field, and this bundle must be built
          # with the same toolchain as the official distribution.
          pnpm_version="$(node -e 'console.log(require(process.argv[1]).packageManager.replace(/^pnpm@/, ""))' "$vencord_dir/package.json")"
          test -n "$pnpm_version"

          {
              echo "VENCORD_DIR=$vencord_dir"
              echo "VENCORD_COMMIT=$(git -C "$vencord_dir" rev-parse HEAD)"
              echo "PNPM_VERSION=$pnpm_version"
          } >> "$GITHUB_ENV"
          echo "Vencord $VENCORD_REF at $(git -C "$vencord_dir" rev-parse --short HEAD), pnpm $pnpm_version"
          du -sh "$vencord_dir"
          SCRIPT

      # Installed by npm from the version read above, so that no third party
      # action and no corepack (on its way out of Node) is involved, and the pin
      # stays Vencord's own.
      - name: pnpm ${{ env.PNPM_VERSION }}
        run: |
          .github/ci/step.sh "Install pnpm" <<'SCRIPT'
          set -euo pipefail
          npm install --global "pnpm@$PNPM_VERSION"
          pnpm --version
          SCRIPT

      - name: Vencord dependencies
        run: |
          bash .github/ci/step.sh "Vencord dependencies" <<'SCRIPT'
          set -euo pipefail
          cd "$VENCORD_DIR"
          pnpm install --frozen-lockfile
          # Checked explicitly: an install that silently did nothing would fail
          # much later with a confusing error. Both of these are devDependencies
          # of Vencord and must exist for the build below.
          test -x node_modules/.bin/esbuild
          test -d node_modules/typescript
          echo "packages: $(ls node_modules | wc -l), size: $(du -sh node_modules | cut -f1)"
          SCRIPT

      - name: Place the plugin into src/userplugins
        run: |
          bash .github/ci/step.sh "Place the plugin" <<'SCRIPT'
          set -euo pipefail
          target="$VENCORD_DIR/src/userplugins/StreamAudioFilter"
          mkdir -p "$target"
          # The tracked files of this repository (the working tree contains
          # nothing else that belongs into a plugin).
          git -C "$GITHUB_WORKSPACE" archive --format=tar HEAD | tar -xf - -C "$target"
          rm -rf "$target/ci-out" "$target/native" "$target/tests" "$target/scripts" "$target/docs" "$target/dev"
          test -f "$target/index.tsx"
          test -f "$target/native.ts"
          test -f "$target/style.css"
          echo "plugin files: $(find "$target" -type f | wc -l)"
          SCRIPT

      - name: Build the distribution
        run: |
          bash .github/ci/step.sh "Build the distribution" <<'SCRIPT'
          set -euo pipefail
          cd "$VENCORD_DIR"
          # --standalone: the flavour the official Vencord installer ships, i.e.
          #   what belongs into %APPDATA%\Vencord\dist (a non-standalone build
          #   would expect a source tree above it and offer to rebuild itself);
          # --disable-updater: Vencord's updater downloads the official build and
          #   replaces this whole dist, which would silently delete the plugin.
          #   This bundle is a pinned distribution instead: updates come from a
          #   new release of this repository.
          pnpm build --standalone --disable-updater
          test -f dist/patcher.js
          test -f dist/renderer.js
          test -f dist/preload.js
          du -sh dist
          SCRIPT

      - name: Verify the bundle really contains the plugin
        run: |
          bash .github/ci/step.sh "Verify the bundle" <<'SCRIPT'
          set -euo pipefail
          cd "$VENCORD_DIR"
          grep -q "StreamAudioFilter" dist/renderer.js
          grep -q "StreamAudioFilter" dist/patcher.js
          # The updater is the one thing that would silently remove the plugin
          # again, so its absence is part of the contract.
          if grep -q "VencordGetUpdates" dist/patcher.js; then
              echo "the updater is still inside the bundle — a Vencord update would remove the plugin"
              exit 1
          fi
          echo "plugin inside renderer.js and patcher.js: $(grep -c StreamAudioFilter dist/renderer.js) / $(grep -c StreamAudioFilter dist/patcher.js)"
          SCRIPT

      - name: Pack
        run: |
          bash .github/ci/step.sh "Pack" <<'SCRIPT'
          set -euo pipefail
          bundle="$RUNNER_TEMP/bundle"
          rm -rf "$bundle"
          mkdir -p "$bundle/Vencord-dist"
          cp "$VENCORD_DIR"/dist/* "$bundle/Vencord-dist/"
          # Source maps are a third of the download and useless to a user.
          find "$bundle" -name '*.map' -delete

          {
              echo "Vencord ref:    $VENCORD_REF"
              echo "Vencord commit: $VENCORD_COMMIT"
              echo "Plugin commit:  $GITHUB_SHA"
              echo "Built:          $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$bundle/VENCORD-VERSION.txt"

          cat > "$bundle/README.txt" <<'EOF'
          Vencord + StreamAudioFilter (manual installation)
          ================================================

          Most users should run StreamAudioFilter-Setup.exe from the same release
          instead: it does everything below, keeps a backup and can uninstall.

          What is inside:
            Vencord-dist\        Vencord with the plugin built in (-> %APPDATA%\Vencord\dist)
            VENCORD-VERSION.txt  which Vencord commit this is and when it was built

          Manual installation (Windows)
          -----------------------------
            1. Quit Discord completely (tray icon -> Quit Discord).
            2. Have Vencord injected into Discord (official installer from
               https://vencord.dev/download), or run StreamAudioFilter-Setup.exe.
            3. Replace the contents of %APPDATA%\Vencord\dist\ with Vencord-dist\*.
            4. Put saf-audio-host.exe from the same release into
                   %APPDATA%\Vencord\streamAudioFilter\native\<version>\   (e.g. native\0.2.0\)
            5. Start Discord. StreamAudioFilter is enabled by default; its panel
               opens from the button next to the microphone.

          All parts must come from the same release: the plugin refuses an audio
          host that speaks another protocol and says so in its panel.

          Updates
          -------
          Vencord's own updater is off in this build: it would replace this dist
          with the official one and remove the plugin. Install a newer release of
          StreamAudioFilter instead (the installer keeps all Vencord settings).
          If a Discord update removes Vencord, run the installer again (Repair).

          Licence: GPL-3.0-or-later. Contains Vencord (GPL-3.0-or-later) and its
          third party notices (the *.LEGAL.txt files).
          EOF

          cd "$bundle"
          zip -qr "$GITHUB_WORKSPACE/streamaudiofilter-vencord-dist.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum streamaudiofilter-vencord-dist.zip | tee streamaudiofilter-vencord-dist.zip.sha256
          unzip -l streamaudiofilter-vencord-dist.zip
          SCRIPT

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: streamaudiofilter-vencord-bundle
          path: |
            streamaudiofilter-vencord-dist.zip
            streamaudiofilter-vencord-dist.zip.sha256
